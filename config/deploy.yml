service: llm_guard
image: ghcr.io/bagashe/llm_guard

servers:
  web:
    - 54.148.112.4

proxy:
  app_port: 8080
  healthcheck:
    path: /healthz
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: ${KAMAL_REGISTRY_USERNAME}
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    LISTEN_ADDR: ":8080"
    DATABASE_PATH: /app/storage/llm_guard.db
    CLASSIFIER_PATH: /app/models/classifier_v1.json
    WORD_CLASSIFIER_PATH: /app/models/word_classifier_v1.json
    DOMAIN_BLACKLIST_PATH: /app/config/domain_blacklist.txt
    INTERNAL_DESTINATION_ALLOWLIST_PATH: /app/config/internal_destination_allowlist.txt
    GEOIP_DB_PATH: /app/geoip/GeoLite2-Country.mmdb
    FAIL_CLOSED: "true"
    TRUST_PROXY_HEADERS: "true"
    RATE_LIMIT_RPS: "10"
    RATE_LIMIT_BURST: "20"
    DEBUG: "false"
    REGISTRATION_ENABLED: "true"
    REGISTRATION_DIFFICULTY: "26"
    REGISTRATION_DEFAULT_DAILY_LIMIT: "1000"
  secret:
    - INITIAL_API_KEYS
    - COUNTRY_BLACKLIST

volumes:
  - llm_guard_storage:/app/storage
